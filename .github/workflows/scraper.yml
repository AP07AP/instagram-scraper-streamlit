name: Instagram Scraper (FAST Ubuntu)

on:
  workflow_dispatch:
    inputs:
      profile_url:
        description: 'Instagram Profile URL or username'
        required: true
      start_date:
        description: 'Start Date (YYYY-MM-DD)'
        required: true
      end_date:
        description: 'End Date (YYYY-MM-DD)'
        required: true
      username:
        description: 'Instagram Username'
        required: true
      artifact_name:
        description: 'Unique artifact name to store CSV'
        required: true

jobs:
  scrape:
    runs-on: ubuntu-latest   # ⭐ MUCH FASTER THAN WINDOWS

    steps:
    - name: Checkout repository
      uses: actions/checkout@v3

    # ------------------------------
    # Install Chrome + ChromeDriver
    # ------------------------------
    - name: Install Chrome
      run: |
        sudo apt update
        sudo apt install -y wget gnupg unzip
        wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | sudo apt-key add -
        echo "deb [arch=amd64] http://dl.google.com/linux/chrome/deb/ stable main" | sudo tee /etc/apt/sources.list.d/google-chrome.list
        sudo apt update
        sudo apt install -y google-chrome-stable

    - name: Install ChromeDriver (Auto-matched to Chrome version)
      run: |
        CHROME_VERSION=$(google-chrome --version | cut -d ' ' -f3 | cut -d '.' -f1)
        DRIVER_VERSION=$(curl -s "https://googlechromelabs.github.io/chrome-for-testing/LATEST_RELEASE_${CHROME_VERSION}")
        wget -N "https://storage.googleapis.com/chrome-for-testing-public/${DRIVER_VERSION}/linux64/chromedriver-linux64.zip"
        unzip chromedriver-linux64.zip
        sudo mv chromedriver-linux64/chromedriver /usr/local/bin/
        sudo chmod +x /usr/local/bin/chromedriver

    # ------------------------------
    # Install Python & dependencies
    # ------------------------------
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Cache pip
      uses: actions/cache@v4
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        pip install --upgrade pip
        pip install -r requirements.txt

    # ------------------------------
    # Run scraper
    # ------------------------------
    - name: Run scraper
      run: python scraper.py "${{ github.event.inputs.profile_url }}" "${{ github.event.inputs.start_date }}" "${{ github.event.inputs.end_date }}" "${{ github.event.inputs.username }}" "${{ github.event.inputs.artifact_name }}"

    # ------------------------------
    # Upload scraped CSV
    # ------------------------------
    - name: Upload scraped CSV as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ github.event.inputs.artifact_name }}
        path: "*.csv"

    # ------------------------------
    # Upload screenshots if any
    # ------------------------------
    - name: Upload screenshot artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: click-error-screenshot
        path: click_error.png

    - name: Upload second screenshot artifact
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: click-error-screenshot-1
        path: click_error1.png
